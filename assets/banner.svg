<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Khaled's FiveM — private GTA V server, Kuwait">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#FFB021" stop-opacity=".14"/>
      <stop offset="60%" stop-color="#FFB021" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="btn" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1B2230"/>
      <stop offset="100%" stop-color="#10141D"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB021" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB021" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#FFB021" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="1280" height="400" fill="#0B0E14"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- horizon road lines -->
  <rect x="0" y="318" width="1280" height="2" fill="url(#road)" opacity=".55"/>
  <g fill="#FFB021" opacity=".5">
    <rect x="180" y="317" width="46" height="4" rx="2"/>
    <rect x="300" y="317" width="34" height="4" rx="2"/>
    <rect x="396" y="317" width="22" height="4" rx="2"/>
    <rect x="466" y="317" width="14" height="4" rx="2"/>
  </g>

  <!-- engine start button -->
  <g transform="translate(1020,200)">
    <circle r="126" fill="#10141D"/>
    <circle r="126" fill="none" stroke="#222B3B" stroke-width="2"/>
    <circle r="112" fill="url(#btn)" stroke="#FFB021" stroke-width="3"/>
    <circle r="112" fill="none" stroke="#FFB021" stroke-width="10" opacity=".12"/>
    <!-- power icon -->
    <g stroke="#FFB021" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M -34 -18 A 44 44 0 1 0 34 -18"/>
      <line x1="0" y1="-52" x2="0" y2="-8"/>
    </g>
    <text y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="#FFB021">CONNECT</text>
  </g>

  <!-- title block -->
  <g transform="translate(96,150)">
    <text font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="#E8ECF2">KHALED'S</text>
    <text y="84" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="#FFB021">FIVEM</text>
    <!-- kuwait flag stripe -->
    <g transform="translate(4,116)">
      <rect width="52" height="8" rx="4" fill="#000000" stroke="#222B3B" stroke-width="1"/>
      <rect x="52" width="62" height="8" fill="#007A3D"/>
      <rect x="114" width="62" height="8" fill="#FFFFFF"/>
      <rect x="176" width="62" height="8" rx="4" fill="#CE1126"/>
    </g>
    <text y="164" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6" fill="#8A94A6">PRIVATE SERVER · KUWAIT · 24/7</text>
  </g>
</svg>
