# five-m GTA server — khaled + friends
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Base resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# Fun: vMenu — press M in game (spawn cars, weapons, teleport, weather, outfits)
ensure vMenu
setr vmenu_use_permissions true
setr vmenu_enable_dv_command true
add_ace builtin.everyone "vMenu.Everything" allow
# friends can't kick/ban each other
add_ace builtin.everyone "vMenu.OnlinePlayers.Kick" deny
add_ace builtin.everyone "vMenu.OnlinePlayers.Ban" deny
add_ace builtin.everyone "vMenu.OnlinePlayers.Kill" deny

# txAdmin-style niceties
sv_scriptHookAllowed 0

# Server identity
sv_hostname "khaled's FiveM server"
sets sv_projectName "khaled's FiveM"
sets sv_projectDesc "Private server for khaled + friends"
sets locale "en-US"

# Max players (2-core box — keep it small)
sv_maxclients 16

# Private: don't list on the public server browser
sv_master1 ""

# OneSync (needed for >32 slots; on is fine either way)
set onesync on

# RCON off unless needed
#rcon_password ""

# License key from https://portal.cfx.re (only if the build requires one)
#sv_licenseKey ""
